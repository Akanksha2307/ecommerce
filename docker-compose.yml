services:

  backend:
    build:
      context: ./backend
    container_name: greencart-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:5000
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: greencart-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped